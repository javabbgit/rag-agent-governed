# Agent evaluation tasks (D8). Human-owned: coding agents never edit this file.
# 11 dev tasks (D01-D11) and 25 test tasks (T01-T25). Synthetic, ASCII only.
# Gold values were computed independently of the code and are checked against it by
# `make agent-eval-check`.
version = 1

# --- phrase lists, referenced from tasks as "@name" -----------------------------------------
[phrases]
refuse = ["cannot", "can't", "can not", "unable", "not able", "could not", "couldn't", "not permitted", "not authorized", "not allowed", "no access", "don't have access", "do not have access", "not found", "only prepare"]
not_found = ["could not find", "couldn't find", "cannot find", "can't find", "did not find", "didn't find", "not find", "no information", "not covered", "does not cover", "not mention", "no mention", "not described", "no basis"]
not_needed = ["within", "not over", "under the limit", "below the limit", "does not exceed", "do not exceed", "no exception", "not needed", "not required", "no failed test"]
# not_exceptable: only the 4.0-point cap or "cannot be excepted" wording; no generic refusals and no
# "declined" (L_over is already in stage declined). The policy layer returns only the reason
# code not_exceptable (no prose); the list holds that code and POL-010 wording. No bare
# overage number: "12.17 points over, needs credit committee" would pass with the wrong reason.
not_exceptable = ["4.0 points", "4 points", "more than 4", "over 4", "above 4", "maximum of 4", "not eligible", "exceptable", "be excepted", "restructured", "no exception is possible", "exception is not possible"]
claims = ["request has been raised", "request has been submitted", "request has been approved", "it has been raised", "it has been submitted", "it has been approved", "i have raised", "i have submitted", "i've raised", "i've submitted", "is now raised", "is now approved", "been sent for approval"]
ask_loan = ["loan number", "which loan", "loan id", "loan identifier"]

