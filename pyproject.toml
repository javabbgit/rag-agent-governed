[project]
name = "rag-agent-governed"
version = "0.1.0"
description = "RAG + tool-calling agent over fictional Demo Mortgage Co. documents, routed through a governance gateway."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "openai>=3.46,<4",
    "httpx2",
    "pydantic-settings>=2",
    "psycopg[binary]>=3",
    "pgvector",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "scripts"]
addopts = '-m "not integration and not db"'
markers = [
    "integration: needs the gateway, Ollama or Postgres (excluded from make test)",
    "db: needs Postgres with pgvector and DATABASE_URL (make test-db; excluded from make test)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
